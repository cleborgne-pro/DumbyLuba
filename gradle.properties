android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Sans cette ligne, le daemon Kotlin hérite des 3 Go de org.gradle.jvmargs.
# Le limiter évite ~3 Go de plus par build, surtout quand plusieurs sessions compilent en parallèle.
kotlin.daemon.jvmargs=-Xmx2048m
# Local build cache (~/.gradle/caches/build-cache-1), shared by every worktree: a new session worktree reuses the
# compilation and test results already produced for the same sources instead of starting from scratch.
org.gradle.caching=true
# Parallel project execution and the configuration cache: the second and later builds skip the configuration
# phase (a few seconds each time). Problems stay warnings so that an unsupported task never blocks a build.
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
