; Diagnostic program for the ESP32 gateway (LILYGO TTGO T-Call V1.3, ESP32-WROVER-B).
; Build: pio run   —   Upload: pio run -t upload   —   Console: pio device monitor

[env:tcall]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
upload_speed = 921600
