; ESP32 gateway mounted on the LUBA (LILYGO TTGO T-Call V1.3, ESP32-WROVER-B).
; Same protocol as the Redmi gateway: the Fold connects to it in "Control via the gateway".
;   pio run -e tcall -t upload     build and upload (USB)
;   pio run -e ota -t upload       build and upload over Wi-Fi (code: DUMBYLUBA_CODE variable or prompt)
;   pio device monitor             serial console
;   pio test -e native             core tests (BluFi, protobuf, safety stop) on the computer

[platformio]
default_envs = tcall

[env:tcall]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
test_ignore = test_*
monitor_speed = 115200
upload_speed = 921600

; Same firmware, sent to the gateway over Wi-Fi (tools/ota_upload.py: code proof, MD5, waits for it to come back).
; Host: DUMBYLUBA_HOST (default dumbyluba-esp32.local).
[env:ota]
extends = env:tcall
upload_protocol = custom
upload_command = $PYTHONEXE -I $PROJECT_DIR/tools/ota_upload.py $SOURCE

[env:native]
platform = native
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE -pthread
test_build_src = no
