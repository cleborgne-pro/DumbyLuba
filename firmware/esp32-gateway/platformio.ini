; ESP32 gateway mounted on the LUBA. Two boards (src/board.h):
;   s3lipo  Olimex ESP32-S3-DevKit-Lipo (ESP32-S3-WROOM-1(U)-N8R8: 8 MB quad flash, 8 MB octal PSRAM), default
;   tcall   LILYGO TTGO T-Call V1.3 (ESP32-WROVER-B), boards in service
; Same protocol as the Redmi gateway: the Fold connects to it in "Control via the gateway".
;   pio run -e s3lipo -t upload    build and upload (USB, the board's USB-UART port)
;   pio run -e ota-s3lipo -t upload   build and upload over Wi-Fi (code: DUMBYLUBA_CODE variable or prompt)
;   pio run -e tcall -t upload     T-Call over USB; pio run -e ota -t upload for the T-Call over Wi-Fi
;   pio device monitor             serial console
;   pio test -e native             core tests (BluFi, protobuf, safety stop, battery level) on the computer
; arduino-esp32 3.3.12 (ESP-IDF 5.5.5) through the pioarduino platform, which needs PlatformIO Core >= 6.2.0 (the
; official platform stops at arduino-esp32 2.x). Optional: PLATFORMIO_CORE_DIR=/tmp/esp32-idf5-pio to keep its packages
; apart from those of firmware/esp32-diag (espressif32 6.9.0).

[platformio]
default_envs = s3lipo

; Shared by both boards.
[gateway]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; NimBLE-Arduino carries its own NimBLE host (nimconfig.h, CONFIG_BT_NIMBLE_* macros): host memory (mbufs, HCI buffers,
; GATT tables) in PSRAM, a single connection (the robot), central and observer roles only (no server, no advertising).
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
; C++17 as the native tests (the core defaults to gnu++2a). -mfix-esp32-psram-cache-issue comes with the platform for
; the T-Call's ESP32 only (PSRAM cache bug of the classic ESP32, revision 1.0 on the test board); not on the ESP32-S3.
build_unflags = -std=gnu++2b -std=gnu++2a
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
; Matter and esp_modem taken off the link line (unused; they were supplying std::string code, see the script).
extra_scripts = post:tools/drop_unused_libs.py
; Arduino components the gateway does not use (Matter, Zigbee, RainMaker, Insights and its log hook, provisioning...):
; dropped from the rebuilt libraries. Kept: Wi-Fi, lwIP, mDNS, HTTP server, OTA (app_update), NVS, Bluetooth controller.
custom_component_remove =
    espressif/esp_matter
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/network_provisioning
    espressif/cbor
    espressif/qrcode
    espressif/libsodium
    espressif/esp-modbus
    espressif/esp-dsp
    chmorgan/esp-libhelix-mp3
test_ignore = test_*
monitor_speed = 115200
upload_speed = 921600

[env:tcall]
extends = gateway
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    ${gateway.build_flags}
    -DGW_BOARD_TCALL
; ESP-IDF configuration of the Arduino libraries, rebuilt by pioarduino ("hybrid compile", see README, Toolchain):
; Wi-Fi and lwIP buffers in PSRAM, malloc blocks over 256 bytes in PSRAM (4096 in the core), esp_timer and timer
; service stacks at 4 KB and 2 KB (8 KB and 4 KB in the core, a few hundred bytes used), Bluetooth controller in
; BLE-only mode for one connection, no Bluedroid host (NimBLE-Arduino brings its own). Flash and PSRAM speeds set back
; to those of the precompiled libraries (80 MHz, HSPI host kept for a 32 Mbit PSRAM at 80 MHz): the rebuild derives
; them from the board's f_flash (40 MHz), and raising f_flash would also change the image header and the bootloader,
; which stay DIO 40 MHz as before. Bootloader, partitions and rollback settings are those of the precompiled
; libraries. Generated files: see .gitignore.
custom_sdkconfig =
    '# CONFIG_ESPTOOLPY_FLASHFREQ_40M is not set'
    CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
    CONFIG_ESPTOOLPY_FLASHFREQ="80m"
    '# CONFIG_SPIRAM_SPEED_40M is not set'
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_SPEED=80
    CONFIG_SPIRAM_OCCUPY_HSPI_HOST=y
    '# CONFIG_SPIRAM_OCCUPY_VSPI_HOST is not set'
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=6
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2048
    '# CONFIG_BT_BLUEDROID_ENABLED is not set'
    CONFIG_BT_CONTROLLER_ONLY=y
    '# CONFIG_BTDM_CTRL_MODE_BTDM is not set'
    CONFIG_BTDM_CTRL_MODE_BLE_ONLY=y
    CONFIG_BTDM_CTRL_BLE_MAX_CONN=1
    '# CONFIG_BLE_MESH is not set'
    '# CONFIG_BTDM_BLE_MESH_SCAN_DUPL_EN is not set'

; Same firmware, sent to the gateway over Wi-Fi (tools/ota_upload.py: code proof, MD5, waits for it to come back).
; Host: DUMBYLUBA_HOST (default dumbyluba-esp32.local).
[env:ota]
extends = env:tcall
upload_protocol = custom
upload_command = $PYTHONEXE -I $PROJECT_DIR/tools/ota_upload.py $SOURCE

; Olimex ESP32-S3-DevKit-Lipo, EA variant (u.FL antenna). PlatformIO has no board file for it: the Espressif
; DevKitC-1 N8R8 has the same memory (memory_type qio_opi: QIO flash and octal PSRAM, both at 80 MHz, 8 MB flash), and
; the variant of the Arduino board "OLIMEX ESP32-S3-DevKit-Lipo" gives its pin names. Console and upload through the
; USB-UART port (CH340X on UART0, auto-reset): Serial stays on UART0, no USB CDC on boot.
[env:s3lipo]
extends = gateway
board = esp32-s3-devkitc1-n8r8
board_build.variant = esp32s3-devkit-lipo
board_build.partitions = ota_8mb.csv
build_flags =
    ${gateway.build_flags}
    -DGW_BOARD_S3LIPO
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
; ESP-IDF configuration of the Arduino libraries (hybrid compile), the T-Call's for an ESP32-S3. Octal PSRAM, QIO flash
; and their 80 MHz clock come from the board (memory_type qio_opi, f_flash 80 MHz), Wi-Fi and lwIP buffers in PSRAM
; (CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP) and the absence of Bluedroid from the Arduino ESP32-S3 template: not repeated.
;   CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=6            6 internal static TX buffers of 1.6 KB as on the T-Call (8 in
;                                                    the template); frames beyond wait in the cache queue.
;   CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256           malloc blocks over 256 bytes in PSRAM (4096 in the template).
;   CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096             8 KB in the template, a few hundred bytes used on the T-Call.
;   CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2048       3,120 bytes in the template, at most 500 used on the T-Call.
;   no CONFIG_BT_NIMBLE_ENABLED, CONFIG_BT_CONTROLLER_ONLY=y   the ESP32-S3 template builds the IDF NimBLE host:
;                                                    controller only, NimBLE-Arduino brings its own host.
;   no CONFIG_BLE_MESH, no CONFIG_BT_CTRL_BLE_MESH_SCAN_DUPL_EN   no BLE mesh, nor its duplicate-scan cache in the
;                                                    controller (CONFIG_BTDM_BLE_MESH_SCAN_DUPL_EN on the T-Call).
; No ESP32-S3 equivalent: CONFIG_BTDM_CTRL_MODE_BLE_ONLY (the S3 controller is BLE only), the HSPI host and the
; flash and PSRAM speeds set back on the T-Call (separate octal PSRAM bus, speeds already 80 MHz from the board).
; CONFIG_BTDM_CTRL_BLE_MAX_CONN=1 has none either: the S3 controller counts scans, connection attempts and links
; together (CONFIG_BT_CTRL_BLE_MAX_ACT), left at its default of 6 until tried with the robot.
custom_sdkconfig =
    CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM=6
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=256
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2048
    '# CONFIG_BT_NIMBLE_ENABLED is not set'
    CONFIG_BT_CONTROLLER_ONLY=y
    '# CONFIG_BLE_MESH is not set'
    '# CONFIG_BT_CTRL_BLE_MESH_SCAN_DUPL_EN is not set'

; Olimex board over Wi-Fi, same tool and host as [env:ota].
[env:ota-s3lipo]
extends = env:s3lipo
upload_protocol = custom
upload_command = $PYTHONEXE -I $PROJECT_DIR/tools/ota_upload.py $SOURCE

[env:native]
platform = native
build_flags = -std=c++17 -DUNITY_INCLUDE_DOUBLE -pthread
test_build_src = no
