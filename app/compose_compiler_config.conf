// Types the Compose compiler cannot prove immutable but that never change once built. Declared here rather than
// annotated with @Immutable, so the domain packages stay free of Compose. Without them RobotUi, RobotMap and CloudUi
// were unstable (compose compiler report), so a screen could not skip a part whose data had not changed.
// Collections: never mutate a list after putting it into the state.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.collections.Collection
kotlin.collections.Iterable
// A path, never a file content.
java.io.File
// Lazy outline and footprint derived from immutable fields.
fr.luba.poc.map.MapDrawing
// Image bytes kept as received, never written; equality by arrival.
fr.luba.poc.diagnostics.PerceptionMapFrame
